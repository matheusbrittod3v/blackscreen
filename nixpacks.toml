[phases.setup]
# Usamos o repositório 24.11 estável do Nix para garantir o .NET 9 SDK
nixPkgs = ["nodejs", "dotnet-sdk_9"]
nixpkgsArchive = "a1190534c03d527236526702e52e46048d087b7a"

[phases.install]
cmds = ["cd admin-panel && npm install"]

[phases.build]
cmds = ["echo 'Pulo do gato: Ignorando build automático para permitir compilação manual via painel'"]

[start]
cmd = "cd admin-panel && node server.js"

[variables]
NODE_ENV = "production"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
