[phases.setup]
nixPkgs = ["nodejs", "curl", "icu", "zlib", "openssl"]

[phases.install]
cmds = [
    "cd admin-panel && npm install",
    "curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --channel 9.0 --install-dir /usr/local/bin"
]

[phases.build]
cmds = ["echo 'Pulo do gato: .NET 9 instalado via script oficial para evitar erros de repositório'"]

[start]
cmd = "cd admin-panel && node server.js"

[variables]
NODE_ENV = "production"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_ROOT = "/usr/local/bin"
PATH = "$PATH:/usr/local/bin"
