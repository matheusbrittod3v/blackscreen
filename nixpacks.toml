[phases.setup]
nixPkgs = ["nodejs", "curl", "bash", "coreutils", "gawk", "gnugrep", "gnutar", "gzip", "findutils", "icu", "zlib", "openssl"]

[phases.install]
cmds = [
    "cd admin-panel && npm install",
    "curl -sSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh",
    "chmod +x /tmp/dotnet-install.sh",
    "/tmp/dotnet-install.sh --channel 9.0 --install-dir /usr/local/dotnet"
]

[phases.build]
cmds = ["echo '.NET 9 instalado com sucesso!'"]

[start]
cmd = "cd admin-panel && node server.js"

[variables]
NODE_ENV = "production"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_ROOT = "/usr/local/dotnet"
PATH = "/usr/local/dotnet:$PATH"
